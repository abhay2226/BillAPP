name: Deploy frontend to Azure Static Web Apps

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    name: Check and build frontend
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --include=dev
        working-directory: frontend

      - name: Check production API configuration
        run: |
          $apiLine = Get-Content -LiteralPath '.env.production' |
            Where-Object { $_ -cmatch '^REACT_APP_API_URL=' } |
            Select-Object -First 1
          $apiUrl = $apiLine -replace '^REACT_APP_API_URL=', ''
          if ($apiUrl -cnotmatch '^https?://\S+$') {
            Write-Error '::error::Set REACT_APP_API_URL to an HTTP(S) URL in frontend/.env.production.'
            exit 1
          }
          Write-Output 'Production API URL is configured.'
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Test frontend
        run: npm test -- --watchAll=false --runInBand
        working-directory: frontend
        env:
          CI: "true"

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 1

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

      - name: Verify Azure frontend settings
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_STONE_093182600 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret."
            exit 1
          fi

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_STONE_093182600 }}
          action: upload
          app_location: frontend/build
          api_location: ""
          output_location: ""
          skip_app_build: true
