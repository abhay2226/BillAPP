
name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  backend-check:
    name: Check, build and package backend
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify SQLite driver
        working-directory: backend
        run: |
          $checkScript = Join-Path $PWD ('.verify-sqlite-' + [guid]::NewGuid().ToString('N') + '.ts')
          try {
            @'
          import { AppDataSource } from "./src/datasource.ts";
          console.log("SQLite datasource:", AppDataSource.options.type === "sqlite");
          if (AppDataSource.options.type !== "sqlite") process.exitCode = 1;
          '@ | Set-Content -LiteralPath $checkScript -Encoding utf8
            npx tsx $checkScript
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          finally {
            if (Test-Path -LiteralPath $checkScript) {
              Remove-Item -LiteralPath $checkScript -Force
            }
          }

      - name: Type check
        working-directory: backend
        run: npm run check

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Clean previous build
        working-directory: backend
        run: |
          if (Test-Path -LiteralPath 'dist') {
            Remove-Item -LiteralPath 'dist' -Recurse -Force
          }

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify build output
        working-directory: backend
        run: |
          if (-not (Test-Path -LiteralPath 'dist\server.js' -PathType Leaf)) {
            Write-Error '::error::dist/server.js not found'
            exit 1
          }

          if (-not (Test-Path -LiteralPath 'dist\entity\TransactionsProduct.js' -PathType Leaf)) {
            Write-Error '::error::TransactionsProduct.js not found'
            exit 1
          }

          Write-Output 'Backend build output verified.'

      - name: Verify Store entity metadata
        working-directory: backend
        run: |
          $compiledEntity = 'dist\entity\TransactionsProduct.js'
          Write-Output 'Checking compiled TransactionsProduct.js...'

          if (Select-String -Path $compiledEntity -Pattern '__metadata\("design:type", Store\)' -Quiet) {
            Write-Error '::error::Store metadata issue detected in compiled JavaScript.'
            exit 1
          else
            Write-Output 'No direct Store design:type metadata found.'
          }

          Write-Output 'Checking expected Relation metadata...'

          $relationMetadata = Select-String -Path $compiledEntity -Pattern 'design:type.*Object' -Context 4, 4
          if ($relationMetadata) {
            $relationMetadata
          }

      - name: Create dist-only deployment package
        run: |
          $deployDir = Join-Path $env:RUNNER_TEMP 'backend-deploy'
          if (Test-Path -LiteralPath $deployDir) {
            Remove-Item -LiteralPath $deployDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $deployDir | Out-Null
          Copy-Item -Path 'backend\dist\*' -Destination $deployDir -Recurse -Force
          Copy-Item -Path 'backend\package.json', 'backend\package-lock.json' -Destination $deployDir -Force

          $packagePath = Join-Path $deployDir 'package.json'
          $packageJson = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
          $packageJson.main = 'server.js'
          $packageJson.scripts.start = 'node server.js'
          $packageJson.scripts.PSObject.Properties.Remove('build') | Out-Null
          if ($packageJson.scripts.PSObject.Properties['build']) {
            Write-Error '::error::The precompiled deployment package must not have a build script.'
            exit 1
          }
          $packageContents = ($packageJson | ConvertTo-Json -Depth 100) + "`n"
          [System.IO.File]::WriteAllText($packagePath, $packageContents, [System.Text.UTF8Encoding]::new($false))

          if (-not (Test-Path -LiteralPath (Join-Path $deployDir 'server.js') -PathType Leaf)) {
            Write-Error '::error::server.js must be at the deployment package root.'
            exit 1
          }
          if (Test-Path -LiteralPath (Join-Path $deployDir 'node_modules')) {
            Write-Error '::error::Deployment package must not include node_modules.'
            exit 1
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'backend-deploy.zip'
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path (Join-Path $deployDir '*') -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-package
          path: ${{ github.workspace }}/backend-deploy.zip
          if-no-files-found: error
          retention-days: 1

  deploy-backend:
    name: Deploy to Azure App Service
    needs: backend-check

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: windows-latest

    steps:
      - name: Download verified deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-deployment-package
          path: .

      - name: Verify deployment package
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'backend-deploy.zip'
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            Write-Error '::error::Deployment package not found'
            exit 1
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'backend-deploy-verify'
          if (Test-Path -LiteralPath $extractDir) {
            Remove-Item -LiteralPath $extractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir
          Get-ChildItem -LiteralPath $extractDir -Recurse | ForEach-Object {
            Write-Output $_.FullName.Substring($extractDir.Length + 1)
          }

          if (-not (Test-Path -LiteralPath (Join-Path $extractDir 'server.js') -PathType Leaf)) {
            Write-Error '::error::server.js must be at the deployment package root.'
            exit 1
          }
          if (Test-Path -LiteralPath (Join-Path $extractDir 'node_modules')) {
            Write-Error '::error::Deployment package must not include node_modules.'
            exit 1
          }

      - name: Verify Azure publish profile
        env:
          AZURE_BACKEND_PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env: secrets.AZURE_BACKEND_PUBLISH_PROFILE)) {
            Write-Error '::error::Azure publish profile secret is missing.'
            exit 1
          }

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: BillApp-backend
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend-deploy.zip
