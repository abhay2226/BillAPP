
name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Check, build and package backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify SQLite driver
        working-directory: backend
        run: |
          npx tsx -e "import { AppDataSource } from './src/datasource.ts'; console.log('SQLite datasource:', AppDataSource.options.type === 'sqlite')"

      - name: Type check
        working-directory: backend
        run: npm run check

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Clean previous build
        working-directory: backend
        run: rm -rf dist

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify build output
        working-directory: backend
        run: |
          if [ ! -f dist/server.js ]; then
            echo "::error::dist/server.js not found"
            exit 1
          fi

          if [ ! -f dist/entity/TransactionsProduct.js ]; then
            echo "::error::TransactionsProduct.js not found"
            exit 1
          fi

          echo "Backend build output verified."

      - name: Verify Store entity metadata
        working-directory: backend
        run: |
          echo "Checking compiled TransactionsProduct.js..."

          if grep -nE '__metadata\("design:type", Store\)' dist/entity/TransactionsProduct.js; then
            echo "::error::Store metadata issue detected in compiled JavaScript."
            exit 1
          else
            echo "No direct Store design:type metadata found."
          fi

          echo "Checking expected Relation metadata..."

          grep -n -A 4 -B 4 'design:type.*Object' dist/entity/TransactionsProduct.js || true

      - name: Create dist-only deployment package
        run: |
          deploy_dir="$RUNNER_TEMP/backend-deploy"
          rm -rf "$deploy_dir"
          mkdir -p "$deploy_dir"
          cp -R backend/dist/. "$deploy_dir/"
          cp backend/package.json backend/package-lock.json "$deploy_dir/"

          node - "$deploy_dir/package.json" <<'NODE'
          const fs = require("node:fs");
          const packagePath = process.argv[2];
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          packageJson.main = "server.js";
          packageJson.scripts.start = "node server.js";
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          test -f "$deploy_dir/server.js"
          test ! -d "$deploy_dir/node_modules"
          cd "$deploy_dir"
          zip -qr "$GITHUB_WORKSPACE/backend-deploy.zip" .

      - name: Upload verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-package
          path: backend-deploy.zip
          if-no-files-found: error
          retention-days: 1

  deploy-backend:
    name: Deploy to Azure App Service
    needs: backend-check

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download verified deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-deployment-package
          path: .

      - name: Verify deployment package
        run: |
          if [ ! -f backend-deploy.zip ]; then
            echo "::error::Deployment package not found"
            exit 1
          fi

          unzip -Z1 backend-deploy.zip > package-files.txt
          cat package-files.txt
          if ! grep -Fxq "server.js" package-files.txt; then
            echo "::error::server.js must be at the deployment package root."
            exit 1
          fi
          if grep -q '^node_modules/' package-files.txt; then
            echo "::error::Deployment package must not include node_modules."
            exit 1
          fi

      - name: Verify Azure publish profile
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Azure publish profile secret is missing."
            exit 1
          fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: BillApp-backend
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend-deploy.zip
          startup-command: npm ci --omit=dev --no-audit --no-fund && npm start
