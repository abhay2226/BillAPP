
name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-check:
    name: Check, build and package backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Verify SQLite driver
        working-directory: backend
        run: |
          npx tsx -e "import { AppDataSource } from './src/datasource.ts'; console.log('SQLite datasource:', AppDataSource.options.type === 'sqlite')"

      - name: Type check
        working-directory: backend
        run: npm run check

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Clean previous build
        working-directory: backend
        run: rm -rf dist

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify build output
        working-directory: backend
        run: |
          if [ ! -f dist/server.js ]; then
            echo "::error::dist/server.js not found"
            exit 1
          fi

          if [ ! -f dist/entity/TransactionsProduct.js ]; then
            echo "::error::TransactionsProduct.js not found"
            exit 1
          fi

          echo "Backend build output verified."

      - name: Verify Store entity metadata
        working-directory: backend
        run: |
          echo "Checking compiled TransactionsProduct.js..."

          if grep -nE '__metadata\("design:type", Store\)' dist/entity/TransactionsProduct.js; then
            echo "::error::Store metadata issue detected in compiled JavaScript."
            exit 1
          else
            echo "No direct Store design:type metadata found."
          fi

          echo "Checking expected Relation metadata..."

          grep -n -A 4 -B 4 'design:type.*Object' dist/entity/TransactionsProduct.js || true

      - name: Create deployment package
        run: |
          cd backend

          zip -r ../backend-deploy.zip . \
            -x "node_modules/*" \
            -x "node_modules/**" \
            -x ".git/*" \
            -x ".git/**" \
            -x "*.sqlite" \
            -x "*.db" \
            -x ".env" \
            -x ".env.*" \
            -x "npm-debug.log*"

      - name: Upload verified deployment package
        uses: actions/upload-artifact@v4
        with:
          name: backend-deployment-package
          path: backend-deploy.zip
          if-no-files-found: error
          retention-days: 1

  deploy-backend:
    name: Deploy to Azure App Service
    needs: backend-check

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download verified deployment package
        uses: actions/download-artifact@v4
        with:
          name: backend-deployment-package
          path: .

      - name: Verify deployment package
        run: |
          if [ ! -f backend-deploy.zip ]; then
            echo "::error::Deployment package not found"
            exit 1
          fi

          unzip -l backend-deploy.zip | head -40

      - name: Verify Azure publish profile
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Azure publish profile secret is missing."
            exit 1
          fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: BillApp-backend
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend-deploy.zip
