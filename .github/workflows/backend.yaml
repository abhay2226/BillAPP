name: Deploy Backend to Azure Windows App Service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yaml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  AZURE_WEBAPP_NAME: intern
  NODE_VERSION: '22.x'
  NPM_VERSION: '10.9.2'

jobs:

  build:
    name: Build and Package Backend
    runs-on: windows-latest
    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Pin npm version
      - name: Setup npm
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 5. Verify SQLite native driver
      - name: Verify SQLite
        working-directory: backend
        run: |
          node -e "const sqlite3 = require('sqlite3'); console.log('SQLite driver loaded successfully')"

      # 6. TypeScript validation
      - name: TypeScript check
        working-directory: backend
        run: npm run check

      # 7. Run tests
      - name: Run tests
        working-directory: backend
        run: npm test

      # 8. Clean old build
      - name: Clean previous build
        working-directory: backend
        run: |
          if (Test-Path 'dist') {
            Remove-Item 'dist' -Recurse -Force
          }

      # 9. Build TypeScript
      - name: Build backend
        working-directory: backend
        run: npm run build

      # 10. Verify compiled application
      - name: Verify build output
        working-directory: backend
        run: |
          if (!(Test-Path 'dist/server.js')) {
            throw 'dist/server.js was not generated'
          }
          $databaseFiles = Get-ChildItem -LiteralPath 'dist' -Recurse -File |
            Where-Object { $_.Extension -match '^\.(sqlite|sqlite3|db)$' }
          if ($databaseFiles) {
            throw 'Database files must not be included in dist.'
          }
          Write-Host 'Compiled server.js verified.'

      # 11. Remove development dependencies
      - name: Install production dependencies only
        working-directory: backend
        run: npm prune --omit=dev

      # 12. Verify SQLite after pruning
      - name: Verify production SQLite driver
        working-directory: backend
        run: |
          node -e "require('sqlite3'); console.log('Production SQLite driver verified')"

      # 13. Create deployment package
      - name: Create deployment package
        run: |
          $deployDir = Join-Path $env:RUNNER_TEMP 'intern-deploy'
          if (Test-Path $deployDir) {
            Remove-Item $deployDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $deployDir | Out-Null
          # Copy compiled application
          Copy-Item 'backend/dist' $deployDir -Recurse -Force
          # Copy production dependencies
          Copy-Item 'backend/node_modules' $deployDir -Recurse -Force
          # Copy package files
          Copy-Item 'backend/package.json' $deployDir
          Copy-Item 'backend/package-lock.json' $deployDir
          # Create Windows IISNode configuration
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
          <system.webServer>
          <handlers>
          <add name="iisnode" path="dist/server.js" verb="*" modules="iisnode" />
          </handlers>
          <rewrite>
          <rules>
          <rule name="DynamicContent">
          <conditions>
          <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="True" />
          </conditions>
          <action type="Rewrite" url="dist/server.js" />
          </rule>
          </rules>
          </rewrite>
          <iisnode watchedFiles="web.config;*.js" />
          </system.webServer>
          </configuration>
          '@ | Set-Content (Join-Path $deployDir 'web.config') -Encoding utf8
          # Verify deployment files
          if (!(Test-Path (Join-Path $deployDir 'dist/server.js'))) {
            throw 'Compiled server.js missing from deployment package'
          }
          if (!(Test-Path (Join-Path $deployDir 'node_modules/sqlite3'))) {
            throw 'SQLite production dependency missing'
          }
          # Create ZIP with files at package root
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'intern-deploy.zip'
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$deployDir/*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal
          Write-Host 'Deployment package created successfully.'

      # 14. Upload deployment artifact
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: intern-deployment-package
          path: intern-deploy.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Windows App Service
    runs-on: windows-latest
    needs: build
    steps:

      # 15. Download package
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: intern-deployment-package
          path: .

      # 16. Verify publish profile secret
      - name: Verify Azure publish profile
        env:
          AZURE_PROFILE: ${{ secrets.AZURE_NEW_SEC }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_PROFILE)) {
            throw 'Azure Windows publish profile secret is missing'
          }
          if (!(Test-Path 'intern-deploy.zip')) {
            throw 'Deployment ZIP package not found'
          }
          Write-Host 'Publish profile and deployment package verified.'

      # 17. Deploy to Azure
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_NEW_SEC }}
          package: intern-deploy.zip
