scripts:
  - type: afterResponse
    code: "if (pm.response.code === 201) {\r

      \    const jsonData = pm.response.json();\r

      \    const data = jsonData.data;\r

      \r

      \    pm.environment.set(\"token\", data.token);\r

      \    pm.environment.set(\"userId\", data.user.userId);\r

      \    pm.environment.set(\"roleId\", data.user.roleId);\r

      \    pm.environment.set(\"storeId\", data.user.storeId);\r

      \    pm.environment.set(\"sessionId\", data.user.sessionId);\r

      \r

      \    console.log(\"Login data saved\");\r

      }"
